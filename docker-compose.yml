# Docker Compose for Multi-Node Setup
# This demonstrates a 3-node distributed sync cluster

version: '3.8'

services:
  # Node 1
  node1:
    build: .
    container_name: sync_node1
    environment:
      - SYNC_NODE_ID=node1
      - SYNC_DIRECTORY=/sync
      - SYNC_LISTEN_HOST=0.0.0.0
      - SYNC_LISTEN_PORT=8000
      - SYNC_PEERS=node2:8000,node3:8000
    volumes:
      - ./data/node1:/sync
      - ./logs/node1:/app/logs
    ports:
      - "8001:8000"
    networks:
      - sync_network
    command: --node-id node1 --dir /sync --host 0.0.0.0 --port 8000 --peer node2:8000 --peer node3:8000 --log-level INFO
    restart: unless-stopped

  # Node 2
  node2:
    build: .
    container_name: sync_node2
    environment:
      - SYNC_NODE_ID=node2
      - SYNC_DIRECTORY=/sync
      - SYNC_LISTEN_HOST=0.0.0.0
      - SYNC_LISTEN_PORT=8000
      - SYNC_PEERS=node1:8000,node3:8000
    volumes:
      - ./data/node2:/sync
      - ./logs/node2:/app/logs
    ports:
      - "8002:8000"
    networks:
      - sync_network
    command: --node-id node2 --dir /sync --host 0.0.0.0 --port 8000 --peer node1:8000 --peer node3:8000 --log-level INFO
    restart: unless-stopped

  # Node 3
  node3:
    build: .
    container_name: sync_node3
    environment:
      - SYNC_NODE_ID=node3
      - SYNC_DIRECTORY=/sync
      - SYNC_LISTEN_HOST=0.0.0.0
      - SYNC_LISTEN_PORT=8000
      - SYNC_PEERS=node1:8000,node2:8000
    volumes:
      - ./data/node3:/sync
      - ./logs/node3:/app/logs
    ports:
      - "8003:8000"
    networks:
      - sync_network
    command: --node-id node3 --dir /sync --host 0.0.0.0 --port 8000 --peer node1:8000 --peer node2:8000 --log-level INFO
    restart: unless-stopped

networks:
  sync_network:
    driver: bridge

volumes:
  node1_data:
  node2_data:
  node3_data:
