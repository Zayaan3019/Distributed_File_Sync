# Two-node cluster backing the Definition-of-Done #2 integration test.
#
# Two nodes, not three. The property being demonstrated -- concurrent edits on
# both sides converging, with the loser surfaced as a visible conflict sibling
# -- is pairwise, and a third node adds transfer traffic without adding a case.
# `tests/test_docker_two_node.py` drives this file.
#
# SYNC_PSK is mandatory. NetworkManager refuses to construct without either a
# pre-shared key or an explicit --allow-insecure, so the previous version of
# this file -- which predated the security layer and passed neither -- defined
# containers that would die on the first line of startup. The value here is a
# fixed test key and is not a secret; a real deployment supplies its own.
#
# `version:` is omitted deliberately; Compose v2 warns that it is obsolete.

services:
  node1:
    build: .
    container_name: dfs_node1
    environment:
      - SYNC_PSK=${SYNC_PSK:-docker-integration-preshared-key}
      - PYTHONUNBUFFERED=1
    volumes:
      - node1_data:/sync
    networks:
      - sync_network
    command: >
      --node-id node1 --dir /sync --host 0.0.0.0 --port 8000
      --peer node2:8000 --log-level INFO
    restart: "no"

  node2:
    build: .
    container_name: dfs_node2
    environment:
      - SYNC_PSK=${SYNC_PSK:-docker-integration-preshared-key}
      - PYTHONUNBUFFERED=1
    volumes:
      - node2_data:/sync
    networks:
      - sync_network
    command: >
      --node-id node2 --dir /sync --host 0.0.0.0 --port 8000
      --peer node1:8000 --log-level INFO
    restart: "no"

networks:
  sync_network:
    driver: bridge

# Named volumes rather than host bind mounts. The catalog is SQLite in WAL
# mode, and WAL relies on shared-memory locking that a bind mount from a
# Windows host does not reliably provide. A named volume keeps the database on
# the Linux VM's own filesystem, where the locking primitives are real.
volumes:
  node1_data:
  node2_data:
